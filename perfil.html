<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil · ALPA Creativa</title>
  <meta name="description" content="Gestiona tu cuenta, pedidos y favoritos en ALPA Creativa." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .profile-hero {
      background: linear-gradient(135deg, var(--ivory) 0%, #fff 50%, var(--accent-soft) 100%);
      padding: 50px 0 40px; text-align: center;
    }
    .profile-hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 4vw, 40px); margin-bottom: 4px; }
    .profile-hero h1 em { font-style: italic; color: var(--primary); }
    .profile-hero p { color: var(--ink-2); font-size: 16px; }
    .profile-section { padding: 50px 0 100px; }
    .profile-tabs {
      display: flex; gap: 4px; margin-bottom: 30px;
      border-bottom: 2px solid var(--line); flex-wrap: wrap;
    }
    .profile-tab {
      padding: 12px 20px; font-size: 14px; font-weight: 600;
      color: var(--muted); cursor: pointer; border: none; background: none;
      font-family: inherit; border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: var(--transition);
    }
    .profile-tab:hover { color: var(--ink); }
    .profile-tab--active { color: var(--primary); border-bottom-color: var(--primary); }
    .profile-panel { display: none; }
    .profile-panel--active { display: block; }
    .profile-card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 28px 24px; margin-bottom: 20px;
    }
    .profile-card h3 {
      font-family: 'Playfair Display', serif; font-size: 18px;
      margin-bottom: 16px; color: var(--ink);
    }
    .profile-info { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .profile-info__item label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .profile-info__item span { font-size: 15px; color: var(--ink); font-weight: 500; }
    .order-card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px; margin-bottom: 12px;
    }
    .order-card__head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .order-card__name { font-weight: 600; font-size: 16px; }
    .order-card__status {
      font-size: 12px; font-weight: 600; padding: 4px 12px;
      border-radius: 999px; text-transform: uppercase; letter-spacing: .5px;
    }
    .order-card__status--paid { background: #d4edda; color: #155724; }
    .order-card__status--pending { background: #fff3cd; color: #856404; }
    .order-card__status--fulfilled { background: #cce5ff; color: #004085; }
    .order-card__items { display: flex; gap: 10px; flex-wrap: wrap; }
    .order-card__item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
    .order-card__item img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: var(--bg); }
    .order-card__foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
    .order-card__total { font-weight: 700; font-size: 16px; color: var(--primary); font-family: 'Playfair Display', serif; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state__icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
    .empty-state h3 { font-family: 'Playfair Display', serif; color: var(--ink); margin-bottom: 8px; font-size: 20px; }
    .empty-state p { font-size: 14px; margin-bottom: 16px; }
    .fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .btn--logout { background: transparent; color: #c0392b; border: 1.5px solid #c0392b; }
    .btn--logout:hover { background: #c0392b; color: #fff; }
    @media (max-width: 640px) {
      .profile-info { grid-template-columns: 1fr; }
      .profile-card { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido</a>

  <div id="topbarSlot"></div>
  <div id="headerSlot"></div>

  <section class="profile-hero" id="main-content">
    <div class="container">
      <h1>Hola, <em id="profileName">Usuario</em></h1>
      <p>Gestiona tu cuenta, pedidos y favoritos</p>
    </div>
  </section>

  <section class="profile-section">
    <div class="container" style="max-width: 800px">
      <div class="profile-tabs">
        <button class="profile-tab profile-tab--active" data-panel="panelInfo">Mi perfil</button>
        <button class="profile-tab" data-panel="panelOrders">Mis pedidos</button>
        <button class="profile-tab" data-panel="panelFavs">Favoritos</button>
      </div>

      <div class="profile-panel profile-panel--active" id="panelInfo">
        <div class="profile-card" data-aos="fade-up">
          <h3>Datos personales</h3>
          <div class="profile-info" id="profileInfo"></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <a href="index.html" class="btn btn--primary">Seguir comprando</a>
          <button class="btn btn--logout" id="logoutBtn">Cerrar sesión</button>
        </div>
      </div>

      <div class="profile-panel" id="panelOrders">
        <div id="ordersList"></div>
      </div>

      <div class="profile-panel" id="panelFavs">
        <div id="favoritesList"></div>
      </div>
    </div>
  </section>

  <div id="footerSlot"></div>
  <div id="whatsappSlot"></div>
  <div id="cartSlot"></div>
  <div id="modalSlot"></div>
  <div id="toastSlot"></div>
  <div id="cookieSlot"></div>
  <div id="scrollTopSlot"></div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/shopify-config.js"></script>
  <script src="js/shopify-api.js"></script>
  <script src="js/shopify-auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
