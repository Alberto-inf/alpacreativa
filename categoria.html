  <style>
    .cat-hero {
      background: linear-gradient(135deg, var(--ivory) 0%, #fff 50%, var(--accent-soft) 100%);
      padding: 80px 0 90px;
      position: relative;
      overflow: hidden;
    }
    .cat-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(93, 118, 139, .06) 0, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(203, 179, 155, .08) 0, transparent 40%);
      pointer-events: none;
    }
    .cat-hero__inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .cat-hero__eyebrow {
      font-family: ui-monospace, 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 16px;
      display: inline-block;
      padding: 6px 14px;
      background: var(--surface);
      border-radius: 999px;
      border: 1px solid var(--accent-soft);
    }
    .cat-hero__title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 1.08;
      color: var(--ink);
      margin: 0 0 18px;
      letter-spacing: -.3px;
    }
    .cat-hero__title em { font-style: italic; color: var(--primary); }
    .cat-hero__lead {
      font-size: 17px;
      color: var(--ink-2);
      line-height: 1.6;
      max-width: 480px;
      margin: 0 0 28px;
    }
    .cat-hero__actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .cat-hero__art {
      position: relative;
      display: grid;
      place-items: center;
    }
    .cat-hero__icon {
      width: 180px;
      height: 180px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 50%;
      color: #fff;
      box-shadow: 0 20px 60px rgba(93, 118, 139, .25);
      animation: float 6s ease-in-out infinite;
    }
    .cat-hero__sublist {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
      max-width: 480px;
    }
    .cat-hero__sub {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      color: var(--ink-2);
      cursor: pointer;
      transition: var(--transition);
    }
    .cat-hero__sub:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* smooth page load */
    body { opacity: 0; animation: pageIn .5s ease .05s forwards; }
    @keyframes pageIn { to { opacity: 1; } }

    .cat-hero__eyebrow { opacity: 0; animation: slideUp .5s ease .15s forwards; }
    .cat-hero__title   { opacity: 0; animation: slideUp .5s ease .25s forwards; }
    .cat-hero__lead    { opacity: 0; animation: slideUp .5s ease .35s forwards; }
    .cat-hero__art     { opacity: 0; animation: slideUp .6s ease .4s forwards; }

    .cat-hero__sub { opacity: 0; animation: slideUp .4s ease forwards; }
    .cat-hero__sub:nth-child(1) { animation-delay: .5s; }
    .cat-hero__sub:nth-child(2) { animation-delay: .56s; }
    .cat-hero__sub:nth-child(3) { animation-delay: .62s; }
    .cat-hero__sub:nth-child(4) { animation-delay: .68s; }
    .cat-hero__sub:nth-child(5) { animation-delay: .74s; }
    .cat-hero__sub:nth-child(6) { animation-delay: .8s; }
    .cat-hero__sub:nth-child(7) { animation-delay: .86s; }
    .cat-hero__sub:nth-child(8) { animation-delay: .92s; }
    .cat-hero__sub:nth-child(9) { animation-delay: .98s; }
    .cat-hero__sub:nth-child(10) { animation-delay: 1.04s; }
    .cat-hero__sub:nth-child(11) { animation-delay: 1.1s; }
    .cat-hero__sub:nth-child(12) { animation-delay: 1.16s; }
    .cat-hero__sub:nth-child(13) { animation-delay: 1.22s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .products { opacity: 0; animation: slideUp .6s ease 1s forwards; }

    @media (max-width: 900px) {
      .cat-hero__inner { grid-template-columns: 1fr; text-align: center; }
      .cat-hero__lead { margin-left: auto; margin-right: auto; }
      .cat-hero__sublist { justify-content: center; margin-left: auto; margin-right: auto; }
      .cat-hero__art { order: -1; margin-bottom: 20px; }
      .cat-hero__icon { width: 120px; height: 120px; }
      .cat-hero__icon svg { width: 48px; height: 48px; }
    }
  </style>
</head>
